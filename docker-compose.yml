# =============================================================================
# Software Project Complexity, Architecture & Quality Analyzer
# docker-compose.yml — Phase 27 Full Multi-Container Orchestration
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database Service (Phase 4 & Phase 27)
  # Stores users, projects, analysis runs, metrics, findings, predictions
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: analyzer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analyzer_db}
      POSTGRES_USER: ${POSTGRES_USER:-analyzer_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analyzer_secret_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analyzer_user} -d ${POSTGRES_DB:-analyzer_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Python FastAPI Analyzer Microservice (Phase 8-24 & Phase 27)
  # Multi-dimensional static analysis engine + ML maturity prediction model
  # ---------------------------------------------------------------------------
  analyzer:
    build:
      context: ./analyzer
      dockerfile: Dockerfile
    container_name: analyzer_python
    restart: unless-stopped
    environment:
      MAX_REPO_SIZE_MB: ${MAX_REPO_SIZE_MB:-500}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-300}
      WORKSPACE_TMP_DIR: ${WORKSPACE_TMP_DIR:-/tmp/software-analyzer-workspaces}
    ports:
      - "8000:8000"
    volumes:
      - analysis_tmp:/tmp/software-analyzer-workspaces
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 3. Node.js + Express REST API Backend Service (Phase 3-25 & Phase 27)
  # Orchestrates auth, project management, DB access, and report generation
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analyzer_backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-4000}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://analyzer_user:analyzer_secret_password@postgres:5432/analyzer_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_analyzer_2026_phase27}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ANALYZER_URL: ${ANALYZER_URL:-http://analyzer:8000}
      PYTHON_ANALYZER_URL: ${PYTHON_ANALYZER_URL:-http://analyzer:8000}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      WORKSPACE_TMP_DIR: ${WORKSPACE_TMP_DIR:-/tmp/software-analyzer-workspaces}
    ports:
      - "4000:4000"
    volumes:
      - analysis_tmp:/tmp/software-analyzer-workspaces
    depends_on:
      postgres:
        condition: service_healthy
      analyzer:
        condition: service_healthy
    command: sh -c "npm run db:init && npm start"

  # ---------------------------------------------------------------------------
  # 4. React + Vite Frontend Web App Service (Phase 2 & Phase 27)
  # Serves the user dashboard, compare page, recommendations, & PDF download
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: analyzer_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

# =============================================================================
# Persistent Data Volumes (Phase 27)
# =============================================================================
volumes:
  postgres_data:
    driver: local
  analysis_tmp:
    driver: local
