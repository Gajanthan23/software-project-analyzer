  #     - analyzer

  # ---------------------------------------------------------------------------
  # analyzer
  # Python + FastAPI analysis service (Phase 8)
  # Accepts a repository path, runs all analysis modules, returns JSON results.
  # Runs in an isolated environment; NEVER executes repository code.
  # ---------------------------------------------------------------------------
